<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>缓存清理工具</title>
  <style>
    body { margin:0; padding:24px 16px; background:#101418; color:#e8eef2; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
    .card { max-width:560px; margin:0 auto; background:#171d24; border:1px solid #2a333d; border-radius:10px; padding:24px; }
    h1 { font-size:20px; margin:0 0 8px; }
    p { font-size:14px; line-height:1.6; color:#b7c2cb; }
    ul { padding-left:20px; font-size:13px; line-height:1.7; color:#b7c2cb; }
    .status { margin-top:14px; padding:10px 12px; border-radius:6px; background:#1f2a33; font-size:14px; }
    .status.ok { border-left:4px solid #35c07a; }
    .status.err { border-left:4px solid #e05555; }
    .status.gray { border-left:4px solid #6a7886; }
    button { padding:9px 16px; border:none; border-radius:6px; background:#2a5cff; color:#fff; font-size:14px; cursor:pointer; }
    button:disabled { opacity:.5; cursor:default; }
    .rom-item { display:flex; align-items:center; gap:10px; padding:10px 12px; margin:8px 0; background:#1f2a33; border-radius:6px; font-size:13px; line-height:1.5; }
    .rom-info { flex:1; min-width:0; }
    .rom-name { font-weight:600; font-size:14px; }
    .rom-detail { color:#9fb0bd; word-break:break-all; }
    .match { color:#35c07a; font-weight:600; }
    .mismatch { color:#e05555; font-weight:600; }
    .del-btn { background:#b3452e; flex-shrink:0; }
    .primary-del { background:#b3452e; margin-right:10px; }
    .btn-row { margin-top:16px; display:flex; flex-wrap:wrap; gap:10px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>缓存清理工具</h1>
    <p>本页用于检查并删除当前浏览器 IndexedDB 里的本地游戏缓存（RomStore）。</p>
    <ul>
      <li>列表会显示每条缓存的名字、数据大小，并根据 iNES 头（PRG/CHR bank 数）<b>识别 ROM 的真实身份</b>；</li>
      <li>如果"缓存名"与"识别出的真实 ROM"不一致，说明缓存内容串位，直接删除即可；</li>
      <li>删除后回到模拟器页面<b>刷新</b>，再重新加载游戏测试。</li>
    </ul>
    <div id="romList">正在读取缓存...</div>
    <div class="btn-row">
      <button id="delLegendBtn" class="primary-del" type="button">删除传说之翼</button>
      <button id="refreshBtn" type="button">刷新列表</button>
    </div>
    <div class="status gray" id="status">准备就绪。</div>
  </div>

  <script>
    // 已知 ROM 的 iNES 头特征：[4]=PRG bank 数(16KB), [5]=CHR bank 数(8KB)
    var KNOWN = [
      { prg: 80, chr: 32, label: '传说之翼 (1.5MB)', key: 'legend' },
      { prg: 96, chr: 32, label: '纵横天下 (1.79MB)', key: 'world' },
      { prg: 32, chr: 32, label: '天使之翼2 中文版 (768KB)', key: 'origin' }
    ];

    var statusEl = document.getElementById('status');
    var listEl = document.getElementById('romList');
    var delLegendBtn = document.getElementById('delLegendBtn');

    function setStatus(text, cls) {
      statusEl.textContent = text;
      statusEl.className = 'status ' + (cls || 'gray');
    }

    function openDB() {
      return new Promise(function (resolve, reject) {
        function hook(req) {
          req.onupgradeneeded = function (e) {
            var db = e.target.result;
            if (!db.objectStoreNames.contains('RomStore')) {
              db.createObjectStore('RomStore', { keyPath: 'id' });
            }
          };
          return req;
        }
        // 与模拟器侧相同：不带版本号探测，缺 RomStore 时升一版重开
        var probe = hook(indexedDB.open('GameSavesDB'));
        probe.onsuccess = function (e) {
          var db = e.target.result;
          if (db.objectStoreNames.contains('RomStore')) { resolve(db); return; }
          var next = db.version + 1;
          db.close();
          var req = hook(indexedDB.open('GameSavesDB', next));
          req.onsuccess = function (ev) { resolve(ev.target.result); };
          req.onerror = function () { reject(new Error('IndexedDB 打开失败')); };
        };
        probe.onerror = function () { reject(new Error('IndexedDB 打开失败')); };
      });
    }

    function identifyRom(data) {
      if (!data || data.length < 16) return '数据过小，不是有效的 iNES ROM';
      var prg = data[4], chr = data[5];
      var mapper = ((data[6] >> 4) | (data[7] & 0xF0));
      for (var i = 0; i < KNOWN.length; i++) {
        if (KNOWN[i].prg === prg && KNOWN[i].chr === chr) {
          return KNOWN[i].label + ' [PRG=' + prg + ' CHR=' + chr + ' mapper=' + mapper.toString(16) + ']';
        }
      }
      return '未知ROM [PRG=' + prg + ' CHR=' + chr + ' mapper=' + mapper.toString(16) + ' 大小=' + data.length + 'B]';
    }

    function isMatch(name, data) {
      if (!data || data.length < 16) return false;
      var prg = data[4], chr = data[5];
      if (name.indexOf('传说之翼') !== -1) return prg === 80 && chr === 32;
      if (name.indexOf('纵横天下') !== -1) return prg === 96 && chr === 32;
      if (name === '天使之翼2') return prg === 32 && chr === 32;
      return true;
    }

    function toUint8(data) {
      if (data instanceof Uint8Array) return data;
      if (data instanceof ArrayBuffer) return new Uint8Array(data);
      if (Array.isArray(data)) return new Uint8Array(data);
      return null;
    }

    function loadList() {
      listEl.textContent = '正在读取缓存...';
      openDB().then(function (db) {
        var tx = db.transaction(['RomStore'], 'readonly');
        var store = tx.objectStore('RomStore');
        var items = [];
        var req = store.openCursor();
        req.onsuccess = function (e) {
          var cursor = e.target.result;
          if (cursor) {
            items.push(cursor.value);
            cursor.continue();
          } else {
            renderList(items);
          }
        };
        req.onerror = function () {
          listEl.textContent = '读取失败';
          setStatus('读取 RomStore 失败', 'err');
        };
      }).catch(function (err) {
        listEl.textContent = '';
        setStatus(err.message || String(err), 'err');
      });
    }

    function renderList(items) {
      listEl.innerHTML = '';
      if (!items.length) {
        listEl.innerHTML = '<div class="rom-item"><div class="rom-info">缓存为空（没有任何游戏记录）</div></div>';
        setStatus('缓存为空。', 'ok');
        return;
      }
      // IndexedDB 主键游标按 id 字母序返回：cached_rom_legend 排在最前
      items.forEach(function (rec) {
        var data = toUint8(rec.data);
        var size = data ? data.length : 0;
        var real = identifyRom(data);
        var match = isMatch(rec.name || '', data);
        var row = document.createElement('div');
        row.className = 'rom-item';
        row.innerHTML =
          '<div class="rom-info">' +
          '<div class="rom-name">' + (rec.name || rec.id) + '</div>' +
          '<div class="rom-detail">id: ' + rec.id + ' ｜ ' + size + ' 字节<br>识别: ' + real + ' ｜ ' +
          (match ? '<span class="match">名字与内容一致</span>' : '<span class="mismatch">⚠ 名字与内容不符！</span>') +
          '</div></div>';
        var btn = document.createElement('button');
        btn.className = 'del-btn';
        btn.type = 'button';
        btn.textContent = '删除';
        btn.onclick = function () { deleteRom(rec.id); };
        row.appendChild(btn);
        listEl.appendChild(row);
      });
      setStatus('共 ' + items.length + ' 条缓存记录。', 'gray');
    }

    function deleteRom(id) {
      delLegendBtn.disabled = true;
      openDB().then(function (db) {
        var tx = db.transaction(['RomStore'], 'readwrite');
        tx.objectStore('RomStore').delete(id);
        tx.oncomplete = function () {
          setStatus('已删除: ' + id + '。请刷新模拟器页面后重新测试。', 'ok');
          loadList();
        };
        tx.onerror = function () {
          setStatus('删除失败: ' + id, 'err');
          delLegendBtn.disabled = false;
        };
      }).catch(function (err) {
        setStatus(err.message || String(err), 'err');
        delLegendBtn.disabled = false;
      });
    }

    delLegendBtn.onclick = function () { deleteRom('cached_rom_legend'); };
    document.getElementById('refreshBtn').onclick = loadList;

    loadList();
  </script>
</body>
</html>
